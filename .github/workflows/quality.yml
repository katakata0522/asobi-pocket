name: Public Asobi Pocket QA
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # pushの配信合格記録を手動検証で取り消さず、Draft通知も実検証から分離する。
  group: asobi-qa-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && github.run_id || 'active' }}
  cancel-in-progress: true
jobs:
  quality:
    name: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && format('quality ({0})', matrix.device) || format('Draft quality ({0})', matrix.device) }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, pixel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Prepare published CI dependencies
        run: python3 scripts/public-qa/prepare.py
      - name: Source contracts and regression tests
        run: |
          npm run test:source
          if ls tests/*.test.cjs >/dev/null 2>&1; then node --test tests/*.test.cjs; fi
      - name: Install locked browser tools and discover tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright test --list
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps chromium --only-shell
      - name: Game browser regression
        env:
          CI: 'true'
          ASOBI_DEVICE: ${{ matrix.device }}
        run: npm run test:e2e
